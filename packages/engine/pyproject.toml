[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokelab-engine"
version = "0.1.0"
description = "PokéLab AI · 自研简化版宝可梦 TCG 对战规则引擎（确定性 seed 驱动，零运行时依赖）"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
include = ["engine*"]
